<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Reusable Navbar Fragment -->
<header class="site-header" th:fragment="navbar (activeChapter)">
  <div class="container-fluid px-lg-5">
    <div class="site-nav">
      
      <!-- Brand Identity -->
      <a href="index.html" th:href="@{/}" class="brand-wrapper">
        <div class="brand-title">
          <span class="brand-symbol">IT</span>
          <span>THE WORLD WE BUILT</span>
        </div>
        <span class="brand-tagline d-none d-sm-inline">“Imagine tomorrow. Remove yesterday. Design what comes next.”</span>
      </a>

      <!-- Chapter Navigation Links -->
      <nav class="nav-chapters" aria-label="Chapter Navigation">
        <a href="index.html" th:href="@{/}" 
           class="nav-link-chapter" 
           th:classappend="${activeChapter == '01'} ? 'active' : ''"
           data-chapter="01">
          <span class="ch-num">01</span>
          <span>TOMORROW</span>
        </a>
        <a href="without-it.html" th:href="@{/without}" 
           class="nav-link-chapter" 
           th:classappend="${activeChapter == '02'} ? 'active' : ''"
           data-chapter="02">
          <span class="ch-num">02</span>
          <span>WITHOUT</span>
        </a>
        <a href="beyond-it.html" th:href="@{/beyond}" 
           class="nav-link-chapter" 
           th:classappend="${activeChapter == '03'} ? 'active' : ''"
           data-chapter="03">
          <span class="ch-num">03</span>
          <span>BEYOND</span>
        </a>
      </nav>

      <!-- Utility Actions -->
      <div class="nav-actions">
        <!-- Audio Synthesizer Toggle -->
        <button id="audioToggleBtn" class="btn-audio-toggle" type="button" aria-label="Toggle haptic audio">
          <span class="sound-icon">🔊</span>
          <span class="d-none d-md-inline">AUDIO ON</span>
        </button>

        <!-- Current Chapter Badge -->
        <div class="tag-chapter d-none d-md-inline-flex">
          <span class="indicator-dot"></span>
          <span th:text="'CHAPTER ' + ${activeChapter} + ' / 03'">CHAPTER 01 / 03</span>
        </div>

        <!-- Mobile Menu Toggle -->
        <button class="mobile-nav-toggle d-lg-none" type="button" aria-label="Toggle navigation">
          ☰
        </button>
      </div>

    </div>
  </div>
</header>

</body>
</html>
