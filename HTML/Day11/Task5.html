<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Showcase</title>
</head>

<body>
    <center>

    <header>
        <h1>Media Showcase</h1>
    </header>

    <main>

        <section>
            

            <h2>Image Gallery</h2>

            <img src="assets/images/rabbit.jpg" alt="rabbit" width="400" height="300">

            <img src="assets/images/flower.jpg" alt="flower" width="400" height="300">

            <img src="assets/images/nature.jpg" alt="nature" width="400" height="300">
            

            <hr>

            <h2>Audio Player</h2>

            <audio controls>

                <source src="assets/audio/song2.aac" type="audio/mpeg">

                Your browser does not support the audio element.

            </audio>

            <hr>

            <h2>Video Player</h2>

            <video width="400" controls poster="assets/images/spiderman.jpg">

                <source src="assets/Video/spiderman.mp4" type="video/mp4">

                Your browser does not support the video tag.

            </video>
            

            <hr>

            <h2>YouTube Video</h2>

            <iframe
                width="500"
                height="300"
                src=" width="560" height="315" src="https://www.youtube.com/embed/8TZMtslA3UY?si=TkLOg6LNxjw6Hfw7" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>"
                
            </iframe>

            <hr>

            <h2>Google Map</h2>

            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3886.9635174977548!2d80.20188717405166!3d13.037994213421271!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a526752db8ffe35%3A0x7f6a2a2d0ebbdc94!2sSoftlogic!5e0!3m2!1sen!2sin!4v1784899989880!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin">
                
            </iframe>

            <hr>

            <h2>Embedded PDF</h2>

            <iframe
                src="assets/PDF/HTMLmedia.pdf"
                width="400"
                height="300">
            </iframe>
            

        </section>
      

    </main>

    <footer>

        <p>&copy; 2026 Media Showcase. All Rights Reserved.</p>

    </footer>
    </center>

</body>

</html>
