<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Example</title>
</head>

<body>

    <header>
        <h1>Embedding YouTube Video and Google Map</h1>
    </header>

    <main>

        <h2>YouTube Video</h2>

        <iframe
            width="600"
            height="300"
            src="iframe width="560" height="315" src="https://www.youtube.com/embed/n17FwBaQiiA?si=-4tyAa56H3yxVgkT" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>"
            
        </iframe>

        <br><br>

        <h2>Google Map - Chennai</h2>

        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3886.776415983889!2d80.20692687405185!3d13.049898913158845!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a5266c2084f9c3b%3A0x54b9629cc45d76f0!2sNexus%20Vijaya%20Mall!5e0!3m2!1sen!2sin!4v1784838400329!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin">
           
        </iframe>

    </main>

</body>

</html>
