<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Product Cards</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <h1>My Products</h1>

    <div class="product-container">

       
        <div class="product-card">
            <img src="assets/images/teddy.jpg" alt="teddy">

            <h2>Soft Teddy Bear</h2>

            <p class="price">₹799</p>

            <button>Buy Now</button>
        </div>


      
        <div class="product-card">
            <img src="assets/images/doll.jpg" alt="doll">

            <h2>Princess Barbie Doll</h2>

            <p class="price">₹999</p>

            <button>Buy Now</button>
        </div>


        <div class="product-card">
            <img src="assets/images/magiclamp.jpg" alt="magiclamp">

            <h2>Magic Lamp</h2>

            <p class="price">₹599</p>

            <button>Buy Now</button>
        </div>


       
        <div class="product-card">
            <img src="assets/images/handbag.avif" alt="handbag">

            <h2>Fashion Handbag</h2>

            <p class="price">₹1,299</p>

            <button>Buy Now</button>
        </div>


        <div class="product-card">
            <img src="../challengeTask/assets/images/flowerwase.jpg" alt="flowerwase">

            <h2>Flowerwase</h2>

            <p class="price">₹1,799</p>

            <button>Buy Now</button>
        </div>


        <div class="product-card">
            <img src="assets/images/watch.jpg" alt="watch">

            <h2>Classic Wrist Watch</h2>

            <p class="price">₹1,099</p>

            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="../challengeTask/assets/images/wallet.jpg" alt="wallet">

            <h2>Wallet</h2>

            <p class="price">₹1,099</p>

            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="../challengeTask/assets/images/nightlamp.jpg" alt="nightlamp">

            <h2>Night lamp</h2>

            <p class="price">₹1,099</p>

            <button>Buy Now</button>
        </div>


       

    </div>

</body>
</html>
