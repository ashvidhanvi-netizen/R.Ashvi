<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>

   
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    
    <header id="header">
        <div class="logo">Student Portal</div>

        <nav>
            <a href="#">Dashboard</a>
            <a href="#">Courses</a>
            <a href="#">Assignments</a>
            <a href="#">Profile</a>
        </nav>
    </header>

  
    <main>

        <h1>Student Dashboard</h1>

      
        <section class="student-card">
            <h2>Welcome, Ashvi!</h2>
            <p><strong>Course:</strong> Java Full Stack Development</p>
            <p><strong>Student ID:</strong> STU2026</p>
            <p><strong>Status:</strong> Active</p>
        </section>

      
        <section class="dashboard">

            <div class="card">
                <h2>Courses</h2>
                <p>4 Active Courses</p>
                <button>View Courses</button>
            </div>

            <div class="card">
                <h2>Assignments</h2>
                <p>6 Pending Assignments</p>
                <button>View Assignments</button>
            </div>

            <div class="card">
                <h2>Attendance</h2>
                <p>92% Attendance</p>
                <button>View Attendance</button>
            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Student Portal</p>
    </footer>

</body>
</html>
