<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4 - Display None vs Visibility Hidden</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <h1>Display: None vs Visibility: Hidden</h1>

    <div class="section">

        <h2>Display: None</h2>

        <div class="container">

            <div class="card card1">
                Card 1
            </div>

            <div class="card display-none">
                Hidden
            </div>

            <div class="card card3">
                Card 3
            </div>

        </div>

    </div>


    <div class="section">

        <h2>Visibility: Hidden</h2>

        <div class="container">

            <div class="card card1">
                Card 1
            </div>

            <div class="card visibility-hidden">
                Hidden
            </div>

            <div class="card card3">
                Card 3
            </div>

        </div>

    </div>

</body>
</html>
