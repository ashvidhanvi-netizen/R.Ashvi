<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<h1>Electronic Products</h1>

<div class="products">

    <div class="card">
        <img src="assets/images/laptop.avif" alt="Laptop">
        <h3>Laptop</h3>
        <p>₹54,999</p>
    </div>

    <div class="card">
        <img src="assets/images/smart_phone.jpg" alt="Mobile">
        <h3>Smartphone</h3>
        <p>₹29,999</p>
    </div>

    <div class="card">
        <img src="assets/images/headphone.jpg" alt="Headphones">
        <h3>Headphones</h3>
        <p>₹2,499</p>
    </div>

    <div class="card">
        <img src="assets/images/watch.jpg" alt="Watch">
        <h3>Smart Watch</h3>
        <p>₹4,999</p>
    </div>

    <div class="card">
        <img src="assets/images/camera.jpg" alt="Camera">
        <h3>Camera</h3>
        <p>₹39,999</p>
    </div>

    <div class="card">
        <img src="assets/images/speaker.jpg" alt="Speaker">
        <h3>Speaker</h3>
        <p>₹3,499</p>
    </div>

    <div class="card">
        <img src="assets/images/keyboard.jpg" alt="Keyboard">
        <h3>Keyboard</h3>
        <p>₹1,299</p>
    </div>

    <div class="card">
        <img src="assets/images/mouse.jpg" alt="Mouse">
        <h3>Wireless Mouse</h3>
        <p>₹899</p>
    </div>

</div>

</body>
</html>
