<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy & Toy Store</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <h1>Fantasy & Toy Store</h1>

    <p class="subtitle">
        Discover magical treasures and adorable toys that bring imagination to life.
    </p>

    <div class="products">

        <div class="card">
            <img src="assets/images/teddybear.jpg" alt="Teddy Bear">
            <h2>Teddy Bear</h2>
            <p class="price">₹899</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="assets/images/doll.jpg" alt=" Doll">
            <h2>Barbie Doll</h2>
            <p class="price">₹1,499</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="assets/images/magiclamp.jpg" alt="Magic Lamp">
            <h2>Magic Lamp</h2>
            <p class="price">₹2,299</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="assets/images/magicwatch.jpg" alt="magicwatch">
            <h2>Magic Watch</h2>
            <p class="price">₹3,499</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
