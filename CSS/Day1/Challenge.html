<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Colored Boxes</title>

    <style>
        body{background-color: rgba(126, 145, 41, 0.199);}
        
        .box1 {
            background-color: crimson;
            color: white;
            width: 350px;
            height: 150px;
            text-align: center;
            margin: 20px auto;
        }

        .box2 {
            background-color: darkgreen;
            color: white;
            width: 350px;
            height: 150px;
            text-align: center;
            margin: 20px auto;
        }

        .box3 {
            background-color: darkblue;
            color: white;
            width: 350px;
            height: 150px;
            text-align: center;
            margin: 20px auto;
        }
    </style>

</head>

<body>

    <!-- Inline CSS -->

    <div style="background-color: chocolate; color: white; width: 350px; height: 150px; text-align: center; margin: 20px auto;">
        <h2>Box 1</h2>
        <p>This is the first colored box.</p>
    </div>

    <br>

    <div style="background-color: purple; color: white; width: 350px; height: 150px; text-align: center;  margin: 20px auto;">
        <h2>Box 2</h2>
        <p>This is the second colored box.</p>
    </div>

    <br>

    <!-- Internal CSS -->

    <div class="box1">
        <h2>Box 3</h2>
        <p>This is the third colored box.</p>
    </div>

    <br>

    <div class="box2">
        <h2>Box 4</h2>
        <p>This is the fourth colored box.</p>
    </div>

    <br>

    <div class="box3">
        <h2>Box 5</h2>
        <p>This is the fifth colored box.</p>
    </div>

</body>

</html>
