<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flex Navbar and Cards</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <h2>My Website</h2>

        <ul class="menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- Heading -->
    <div class="heading">
        <h1>Popular Courses</h1>
    </div>

    <!-- Cards -->
    <div class="cards">

        <div class="card">
            <img src="assets/images/html.jpg" alt="HTML">
            <h3>HTML</h3>
            <p>HTML is used to create the structure of a webpage.</p>
            <button>Read More</button>
        </div>

        <div class="card">
            <img src="assets/images/css.jpg" alt="CSS">
            <h3>CSS</h3>
            <p>CSS is used to design and style web pages.</p>
            <button>Read More</button>
        </div>

        <div class="card">
            <img src="assets/images/js.jpg" alt="JavaScript">
            <h3>JavaScript</h3>
            <p>JavaScript adds interactivity to websites.</p>
            <button>Read More</button>
        </div>

    </div>

</body>
</html>
