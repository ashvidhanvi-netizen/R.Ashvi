<!DOCTYPE html>

<script>

console.log("Badminton");
console.log("Blue");
console.log("Computer");

</script>

  <h2>Numbers</h2>

<script>

console.log(10);
console.log(25);
console.log(48);
console.log(72);
console.log(100);
console.log(150);

</script>
<h2>Boolean</h2>

<script>
console.log(true);
console.log(false);

console.log(false);

</script>

<h2>Null</h2>

<script>
let selectedColor = null;
let secondaryNumber = null;
let deliveryDate = null;

console.log(selectedColor);
console.log(secondaryNumber);
console.log(deliveryDate);
</script>

<h2>Undefined</h2>

<script>

let customerAddress;
let employeeId;

console.log(productCode);
console.log(customerAddress);
console.log(employeeId);
</script>
