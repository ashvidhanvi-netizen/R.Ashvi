<body>
 <h1 id="title">This is DOM</h1>

    <p class="data"> Paragraph 1</p>
    <p class="data">Paragraph 2</p>
    <p class="data"> Paragraph 3</p>

    <script>

        const titleData = document.getElementById("title");

        const paragraphData = document.querySelectorAll(".data");

        titleData.textContent = "Day1";

        paragraphData.forEach((data) => {
            data.textContent = "This is Dynamic Data";
        });

        console.log(titleData);
        console.log(paragraphData);

    </script>
