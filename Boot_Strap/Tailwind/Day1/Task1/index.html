<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS Tasks</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="p-5">

   
    <h1 class="text-dark-500 font-bold text-center text-2xl mb-5">
        Welcome to Tailwind CSS
    </h1>

  
    <div class="p-5 bg-red-500 rounded-lg mb-5 text-center">
        This is a Tailwind CSS box.
    </div>

   <div class="flex justify-center items-center">
    <button class="bg-amber-600 text-dark px-5 py-2 rounded-lg mb-5  ">
        Click Me
    </button>
    </div>

   
    <div class="flex justify-center  gap-5 mb-5">
        <div class="bg-amber-600 p-5 rounded-lg">
            Box 1
        </div>

        <div class="bg-amber-600 p-5 rounded-lg">
            Box 2
        </div>
    </div>

    <div class="flex justify-center">
    <button class="bg-lime-700 text-white px-5 py-2 rounded-lg
                   hover:bg-blue-700">
        Hover Me
    </button>
    </div>

</body>
</html>
